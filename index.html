<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Weight Tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
    <script src="https://unpkg.com/lucide@latest"></script>
    <meta property="og:title" content="Weight Tracker" />
    <meta property="og:description" content="A minimalist, privacy-respecting workflow application to log and visualize weight metrics." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#003c43" />
    <style>
        :root {
            --accent: #00ffd5;
            --accent-soft: rgba(0, 255, 213, 0.15);
            --secondary: #ff0077;
            --bg: #08090d;
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-dim: #8e9aaf;
            --radius: 28px;
            --btn-height: 54px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 255, 213, 0.06), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 0, 119, 0.06), transparent 40%);
            background-attachment: fixed;
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            padding: 0 16px;
        }

        /* ── NAVIGATION BAR ── */
        .nav-bar {
            width: 100%;
            max-width: 1100px;
            margin: 16px 0;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
            gap: 10px;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .logo {
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        /* ── CUSTOM DROPDOWN ── */
        .custom-select {
            position: relative;
        }

        .custom-select-trigger {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.05);
            padding: 0 11px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            min-width: 80px;
            max-width: 160px;
            user-select: none;
        }

        .custom-select-trigger:hover {
            background: rgba(255,255,255,0.09);
            border-color: rgba(255,255,255,0.2);
        }

        .custom-select.open .custom-select-trigger {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
        }

        .custom-select-icon {
            color: var(--accent);
            flex-shrink: 0;
            display: flex;
            align-items: center;
        }

        .custom-select-label {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .custom-select-chevron {
            color: var(--text-dim);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }

        .custom-select.open .custom-select-chevron {
            transform: rotate(180deg);
        }

        .custom-select-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            min-width: 170px;
            background: #111318;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 6px;
            z-index: 500;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,255,213,0.08);
            display: none;
            backdrop-filter: blur(20px);
        }

        .custom-select.open .custom-select-menu {
            display: block;
            animation: dropIn 0.15s ease;
        }

        @keyframes dropIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .custom-select-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-dim);
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .custom-select-option:hover {
            background: rgba(255,255,255,0.07);
            color: var(--text);
        }

        .custom-select-option.active {
            background: rgba(0, 255, 213, 0.1);
            color: var(--accent);
        }

        .custom-select-option .opt-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
            opacity: 0;
        }

        .custom-select-option.active .opt-dot { opacity: 1; }

        .custom-select-empty {
            padding: 10px 12px;
            font-size: 0.82rem;
            color: var(--text-dim);
            font-style: italic;
        }

        .icon-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--text-dim);
            height: 40px;
            width: 40px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            cursor: pointer;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.08);
            color: var(--text);
            border-color: rgba(255,255,255,0.2);
        }

        /* ── MAIN LAYOUT ── */
        .app-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 20px;
            flex: 1;
            min-height: 0;
            padding-bottom: 20px;
        }

        .main-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            backdrop-filter: blur(20px);
            height: 100%;
        }

        .current-val {
            font-size: clamp(4.5rem, 15vw, 7rem);
            font-weight: 900;
            letter-spacing: -3px;
            background: linear-gradient(to bottom, #fff 40%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .hero-sub {
            font-size: 0.85rem;
            color: var(--accent);
            margin-top: 6px;
            letter-spacing: 0.5px;
            min-height: 1em;
            font-weight: 600;
        }

        .stats-row {
            display: flex;
            align-items: center;
            gap: 0;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: 20px;
            margin-top: 24px;
            overflow: hidden;
        }

        .stat-box {
            flex: 1;
            padding: 14px 20px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text);
        }

        .stat-val.gain { color: var(--secondary); }
        .stat-val.loss { color: var(--accent); }

        .stat-divider {
            width: 1px;
            height: 36px;
            background: var(--border);
            flex-shrink: 0;
        }

        .hero-label {
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ── HORIZONTAL DECK ENTRY LINE ── */
        .entry-group {
            margin-top: 32px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .entry-group input {
            background: transparent;
            border: none;
            padding: 0 16px;
            color: white;
            font-size: 1.05rem;
            height: var(--btn-height);
            min-width: 0;
        }

        .entry-group input:first-of-type {
            flex: 1.1;
            border-right: 1px solid var(--border);
        }

        .entry-group input:last-of-type {
            flex: 0.9;
        }

        .entry-group input:focus {
            outline: none;
        }

        .entry-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            opacity: 0.65;
        }

        .btn-save {
            background: var(--accent);
            color: #08090d;
            border: none;
            padding: 0 28px;
            height: var(--btn-height);
            border-radius: 16px;
            font-weight: 600; /* Cleaned up typography, less overly bold */
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.2s;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .btn-save:hover { opacity: 0.85; }

        /* ── HISTORY PANEL ── */
        .history-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        #historyStream {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
        }

        .history-item {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 12px;
            border: 1px solid transparent;
            position: relative;
            transition: background 0.2s, border-color 0.2s;
        }

        .history-item:hover {
            background: rgba(255,255,255,0.06);
            border-color: var(--border);
        }

        .history-item .item-left { align-self: start; }

        .item-date { color: var(--text-dim); font-size: 0.8rem; font-weight: 500; }
        .item-val { font-weight: 800; font-size: 1.1rem; text-align: right; }

        .trend {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 7px;
            display: inline-block;
            margin-top: 5px;
        }

        .trend.up { background: rgba(255,0,119,0.15); color: var(--secondary); }
        .trend.down { background: rgba(0,255,213,0.15); color: var(--accent); }

        .delete-log-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.18s ease, background 0.18s, border-color 0.18s, color 0.18s;
            opacity: 0;
            pointer-events: none;
        }

        .history-item:hover .delete-log-btn {
            opacity: 1;
            pointer-events: all;
        }

        .delete-log-btn:hover {
            background: rgba(255, 0, 119, 0.15);
            border-color: rgba(255, 0, 119, 0.3);
            color: var(--secondary);
        }

        .delete-log-btn:active {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }

        /* ── MODALS ── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .overlay.active { display: flex; }

        .modal {
            background: #14161f;
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 32px;
            width: 100%;
            max-width: 450px;
        }

        /* ── MOBILE ── */
        @media (max-width: 850px) {
            body { overflow-y: auto; height: auto; padding-top: env(safe-area-inset-top); }

            .nav-bar {
                flex-direction: row;
                flex-wrap: nowrap;
                height: auto;
                padding: 8px 12px;
                gap: 8px;
                border-radius: 18px;
                margin: 10px 0;
            }

            .nav-left {
                flex: 1;
                min-width: 0;
                gap: 6px;
            }

            .nav-right {
                gap: 6px;
                flex-shrink: 0;
            }

            .logo { display: none; }

            .custom-select-trigger {
                max-width: 130px;
                height: 36px;
                border-radius: 10px;
            }

            .custom-select-menu {
                min-width: 150px;
            }

            .icon-btn {
                height: 36px;
                width: 36px;
                border-radius: 10px;
            }

            .app-container { grid-template-columns: 1fr; height: auto; gap: 15px; }

            .main-card { padding: 30px 15px; border-radius: 32px; }

            /* Fixed horizontal toolbar layout on mobile with correct margins */
            .entry-group {
                flex-direction: row; 
                padding: 4px;
                gap: 4px;
                border-radius: 16px;
                margin-top: 24px;
                width: 100%;
                display: flex;
            }

            .entry-group input {
                background: transparent !important;
                color: #ffffff !important;
                height: 52px;
                font-size: 0.95rem;     
                padding: 0 8px;
                min-width: 0;          /* Allows scaling without cutting off */
            }

            .entry-group input:first-of-type {
                flex: 1.3;
                border-right: 1px solid var(--border);
                border-bottom: none;   
            }

            .entry-group input:last-of-type {
                flex: 0.9;
                margin-bottom: 0;
            }

            .btn-save { 
                flex: 0.8;             /* Proportional flex scaling */
                padding: 0;
                height: 52px;          
                border-radius: 12px; 
                font-size: 0.8rem; 
                font-weight: 600;      /* Clean weight matches desktop */
                min-width: 0;
            }

            .history-panel { height: auto; min-height: 400px; padding: 20px 15px; }

            .history-item {
                grid-template-columns: 1fr auto auto;
                padding: 12px 14px;
                background: rgba(255,255,255,0.04);
            }

            .item-val { font-size: 1rem; }

            .delete-log-btn {
                opacity: 0;
                pointer-events: none;
                width: 36px;
                height: 36px;
            }

            .history-item.show-delete .delete-log-btn {
                opacity: 1;
                pointer-events: all;
                background: rgba(255, 0, 119, 0.12);
                border-color: rgba(255, 0, 119, 0.25);
                color: var(--secondary);
            }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<nav class="nav-bar">
    <div class="nav-left">
        <div class="logo">WEIGHT</div>
        <div class="custom-select" id="customSelect">
            <div class="custom-select-trigger" onclick="toggleDropdown()">
                <span class="custom-select-icon"><i data-lucide="users" size="13"></i></span>
                <span class="custom-select-label" id="selectLabel">None</span>
                <span class="custom-select-chevron"><i data-lucide="chevron-down" size="14"></i></span>
            </div>
            <div class="custom-select-menu" id="selectMenu"></div>
        </div>
        <button class="icon-btn" onclick="openModal('profileModal')" title="New profile"><i data-lucide="plus" size="18"></i></button>
        <button class="icon-btn" onclick="deleteCurrentProfile()" style="color: var(--secondary);" title="Delete profile"><i data-lucide="trash-2" size="16"></i></button>
    </div>

    <div class="nav-right">
        <button class="icon-btn" onclick="exportData()" title="Export"><i data-lucide="download" size="16"></i></button>
        <button class="icon-btn" onclick="document.getElementById('importFile').click()" title="Import"><i data-lucide="upload" size="16"></i></button>
        <button class="icon-btn" onclick="openModal('jsonModal')" title="Settings"><i data-lucide="settings" size="16"></i></button>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)">
    </div>
</nav>

<div class="app-container">
    <main class="main-card">
        <span class="hero-label">Current Weight</span>
        <div class="current-val" id="heroWeight">--.-</div>
        <span class="hero-label" style="color: var(--accent); font-weight: 800; margin-top: 5px;">Pounds</span>
        <div class="hero-sub" id="heroSub"></div>

        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-label">Initial Weight</div>
                <div class="stat-val" id="statInitial">--.-</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-box">
                <div class="stat-label">Total Progress</div>
                <div class="stat-val" id="statProgress">--</div>
            </div>
        </div>

        <div class="entry-group">
            <input type="date" id="dateInput">
            <input type="number" id="weightInput" placeholder="000.0" step="0.1" inputmode="decimal">
            <button class="btn-save" onclick="logWeight()">Save</button>
        </div>
    </main>

    <aside class="history-panel">
        <span class="hero-label" style="font-size: 0.7rem;">History Timeline</span>
        <div id="historyStream"></div>
    </aside>
</div>

<div class="overlay" id="profileModal">
    <div class="modal">
        <h2 style="margin-bottom: 20px;">New Profile</h2>
        <input type="text" id="profileInput" style="width: 100%; height: 50px; border-radius: 15px; border: 1px solid var(--border); background: #000; color: #fff; padding: 0 15px; margin-bottom: 20px;" placeholder="Name">
        <div style="display: flex; gap: 10px;">
            <button class="btn-save" style="background: rgba(255,255,255,0.05); color: #fff; flex: 1;" onclick="closeModal('profileModal')">Cancel</button>
            <button class="btn-save" style="flex: 1;" onclick="saveProfile()">Create</button>
        </div>
    </div>
</div>

<div class="overlay" id="jsonModal">
    <div class="modal" style="max-width: 600px;">
        <h2 style="margin-bottom: 15px;">Advanced Editor</h2>
        <textarea id="jsonTextArea" style="width: 100%; height: 300px; background: #000; color: var(--accent); border-radius: 16px; padding: 15px; font-family: monospace; border: 1px solid var(--border); margin-bottom: 20px; resize: none;"></textarea>
        <div style="display: flex; gap: 10px;">
            <button class="btn-save" style="background: rgba(255,255,255,0.05); color: #fff; flex: 1;" onclick="closeModal('jsonModal')">Close</button>
            <button class="btn-save" style="flex: 1;" onclick="applyJson()">Apply</button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    let db = { profiles: {}, activeProfile: "" };
    const KEY = 'weight_v12_mobile';

    const isMobile = () => window.matchMedia('(max-width: 850px)').matches;

    function formatDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function init() {
        const saved = localStorage.getItem(KEY);
        if (saved) db = JSON.parse(saved);
        document.getElementById('dateInput').valueAsDate = new Date();
        refreshUI();

        document.addEventListener('click', (e) => {
            if (!isMobile()) return;
            if (!e.target.closest('.history-item')) {
                document.querySelectorAll('.history-item.show-delete').forEach(el => el.classList.remove('show-delete'));
            }
        });
    }

    function save() { localStorage.setItem(KEY, JSON.stringify(db)); }

    function refreshUI() {
        const stream = document.getElementById('historyStream');
        const hero = document.getElementById('heroWeight');
        const names = Object.keys(db.profiles);

        buildDropdown();

        if (names.length === 0) {
            hero.innerText = "--.-";
            document.getElementById('heroSub').innerText = '';
            document.getElementById('statInitial').innerText = '--';
            document.getElementById('statProgress').innerText = '--';
            stream.innerHTML = '<div style="text-align:center; padding-top: 30px; color: var(--text-dim);">No data.</div>';
            return;
        }

        const logs = db.profiles[db.activeProfile].logs;
        logs.sort((a,b) => new Date(b.date) - new Date(a.date));

        const latest = logs.length ? logs[0] : null;
        const oldest = logs.length ? logs[logs.length - 1] : null;

        hero.innerText = latest ? latest.weight.toFixed(1) : "0.0";
        
        const heroSub = document.getElementById('heroSub');
        heroSub.innerText = latest ? formatDate(latest.date) : '';

        const statInitial = document.getElementById('statInitial');
        const statProgress = document.getElementById('statProgress');
        if (oldest) {
            statInitial.innerText = oldest.weight.toFixed(1) + ' LBS';
            statInitial.className = 'stat-val';
        } else {
            statInitial.innerText = '--';
            statInitial.className = 'stat-val';
        }
        if (latest && oldest && logs.length > 1) {
            const diff = latest.weight - oldest.weight;
            const gained = diff > 0;
            statProgress.innerText = (gained ? '+' : '') + diff.toFixed(1) + ' LBS';
            statProgress.className = 'stat-val ' + (gained ? 'gain' : 'loss');
        } else {
            statProgress.innerText = '--';
            statProgress.className = 'stat-val';
        }

        stream.innerHTML = '';

        logs.forEach((l, i) => {
            let trend = '';
            if (i < logs.length - 1) {
                const diff = l.weight - logs[i+1].weight;
                const gained = diff > 0;
                const arrow = gained ? '↑' : '↓';
                const label = gained ? 'Gained' : 'Lost';
                trend = `<div class="trend ${gained ? 'up' : 'down'}">${arrow} ${label} ${Math.abs(diff).toFixed(1)} LBS</div>`;
            }
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="item-left">
                    <div class="item-date">${formatDate(l.date)}</div>
                    ${trend}
                </div>
                <div class="item-val">${l.weight.toFixed(1)} <span style="font-size: 0.6rem; color: var(--text-dim);">LB</span></div>
                <button class="delete-log-btn" onclick="handleDelete(event, '${l.date}')">
                    <i data-lucide="x" size="15"></i>
                </button>
            `;

            item.addEventListener('click', (e) => {
                if (!isMobile()) return;
                if (e.target.closest('.delete-log-btn')) return;
                document.querySelectorAll('.history-item.show-delete').forEach(el => {
                    if (el !== item) el.classList.remove('show-delete');
                });
                item.classList.toggle('show-delete');
            });

            stream.appendChild(item);
        });
        lucide.createIcons();
    }

    function handleDelete(e, date) {
        e.stopPropagation();
        if (confirm("Delete this entry?")) {
            const logs = db.profiles[db.activeProfile].logs;
            const idx = logs.findIndex(l => l.date === date);
            if (idx > -1) { logs.splice(idx, 1); save(); refreshUI(); }
        }
    }

    function logWeight() {
        const w = parseFloat(document.getElementById('weightInput').value);
        const d = document.getElementById('dateInput').value;
        if (!db.activeProfile || !w || !d) return;
        const logs = db.profiles[db.activeProfile].logs;
        const exists = logs.findIndex(x => x.date === d);
        if (exists > -1) logs[exists].weight = w;
        else logs.push({ date: d, weight: w });
        save(); refreshUI();
        document.getElementById('weightInput').value = '';
    }

    function saveProfile() {
        const name = document.getElementById('profileInput').value.trim();
        if (!name) return;
        if (!db.profiles[name]) db.profiles[name] = { logs: [] };
        db.activeProfile = name;
        save(); refreshUI(); closeModal('profileModal');
        document.getElementById('profileInput').value = '';
    }

    function deleteCurrentProfile() {
        if (confirm(`Delete profile "${db.activeProfile}"?`)) {
            delete db.profiles[db.activeProfile];
            db.activeProfile = Object.keys(db.profiles)[0] || "";
            save(); refreshUI();
        }
    }

    function toggleDropdown() {
        document.getElementById('customSelect').classList.toggle('open');
    }

    function closeDropdown() {
        document.getElementById('customSelect').classList.remove('open');
    }

    function buildDropdown() {
        const menu = document.getElementById('selectMenu');
        const label = document.getElementById('selectLabel');
        const names = Object.keys(db.profiles).sort();

        menu.innerHTML = '';
        if (names.length === 0) {
            label.textContent = 'None';
            menu.innerHTML = '<div class="custom-select-empty">No profiles yet</div>';
            return;
        }

        label.textContent = db.activeProfile || names[0];

        names.forEach(n => {
            const opt = document.createElement('div');
            opt.className = 'custom-select-option' + (n === db.activeProfile ? ' active' : '');
            opt.innerHTML = `<span class="opt-dot"></span>${n}`;
            opt.addEventListener('click', () => {
                db.activeProfile = n;
                save(); refreshUI(); closeDropdown();
            });
            menu.appendChild(opt);
        });
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('#customSelect')) closeDropdown();
    });

    function openModal(id) {
        document.getElementById(id).classList.add('active');
        if(id === 'jsonModal') document.getElementById('jsonTextArea').value = JSON.stringify(db, null, 4);
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function applyJson() {
        try {
            db = JSON.parse(document.getElementById('jsonTextArea').value);
            save(); refreshUI(); closeModal('jsonModal');
        } catch(e) { alert("Error"); }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
        const dl = document.createElement('a');
        dl.setAttribute("href", dataStr);
        dl.setAttribute("download", "weight_data.json");
        dl.click();
    }

    function importData(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            db = JSON.parse(event.target.result);
            save(); refreshUI();
        };
        reader.readAsText(e.target.files[0]);
    }

    init();
</script>
</body>
</html>
